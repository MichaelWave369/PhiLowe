name: PhiLowe CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Reject undefined variables and missing hooks
        run: npm run lint
      - name: Verify jokes and shuffle-bag behavior
        run: npm test
      - name: Build React site
        run: npm run build
      - name: Smoke-test actual browser rendering (root path)
        run: npm run smoke
      - name: Build with GitHub Pages base path
        run: npm run build -- --base=/PhiLowe/
      - name: Smoke-test GitHub Pages subpath
        run: npm run smoke:pages
